<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in to Kitlane</title>
<style>
:root{color-scheme:light dark;font:16px system-ui;background:#081b31;color:#edf4fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px}main{width:min(100%,480px)}.brand{font-size:32px;font-weight:750;letter-spacing:-1px;margin-bottom:64px}.mark{display:inline-block;width:28px;height:28px;border:7px solid #01bcfb;border-right-color:#19f5be;border-radius:8px;margin-right:12px;vertical-align:middle}h1{font-size:34px;letter-spacing:-1px;line-height:1.15}p{color:#b1c4d4;line-height:1.65}button{font:inherit;width:100%;padding:16px;border:1px solid #335269;border-radius:10px;cursor:pointer;background:#19f5be;color:#081b31;font-weight:650;margin-top:20px}button:hover{filter:brightness(1.06)}button:active{transform:translateY(1px)}button:focus-visible{outline:3px solid #01bcfb;outline-offset:4px}button:disabled{opacity:.45;cursor:wait}#status{min-height:48px;font-size:14px}.note{font-size:13px;margin-top:36px}@media(prefers-color-scheme:light){:root{background:#f4f7fa;color:#081b31}p{color:#536c87}button{border-color:#c8d9e6}}@media(prefers-reduced-motion:no-preference){button{transition:filter .15s,transform .1s}}[hidden]{display:none}
</style></head><body><main><div class="brand"><span class="mark" aria-hidden="true"></span>Kitlane</div><h1 id="heading">Your apps. Your devices.</h1><p id="description">Sign in with Google to connect this computer to your Kitlane account.</p><button id="google" disabled>Continue with Google</button><button id="authorize" hidden>Authorize this computer</button><p id="status" role="status" aria-live="polite">Preparing secure sign-in…</p><p class="note">Signing in connects your account. Inventory is shared only when you choose Sync in Kitlane.</p></main><script type="module" src="/bridge.js"></script></body></html>
