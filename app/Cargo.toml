[package]
name = "kitlane"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Kitlane native desktop application"
default-run = "kitlane"

[workspace]
members = ["core", "sync-server", "sync-client", "account-client"]
resolver = "3"

[dependencies]
kitlane-core = { path = "core" }
kitlane-sync-client = { path = "sync-client" }
kitlane-account-client = { path = "account-client" }
zeroize = "1"
serde_json = "1"
eframe = { version = "0.36.2", default-features = false, features = ["glow", "accesskit", "wayland", "x11", "links"] }
egui_extras = { version = "0.36.2", default-features = false, features = ["svg", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
pelite = "0.10"

[build-dependencies]
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_code = "forbid"
