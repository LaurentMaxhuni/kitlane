[package]
name = "kitlane"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Kitlane native desktop application"
default-run = "kitlane"

[workspace]
members = ["core", "sync-server", "sync-client", "account-client"]
resolver = "3"

[dependencies]
kitlane-core = { path = "core" }
kitlane-sync-client = { path = "sync-client" }
kitlane-account-client = { path = "account-client" }
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = "2"
semver = "1"
getrandom = "0.3"

eframe = { version = "0.36.2", default-features = false, features = ["glow", "accesskit", "wayland", "x11", "links"] }
egui_extras = { version = "0.36.2", default-features = false, features = ["svg", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
pelite = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[build-dependencies]
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_code = "forbid"
