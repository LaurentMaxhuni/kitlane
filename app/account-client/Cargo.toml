[package]
name = "kitlane-account-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
kitlane-core = { path = "../core" }
kitlane-sync-client = { path = "../sync-client" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"
getrandom = "0.3"
base64 = "0.22"
webbrowser = "1"

[lints.rust]
unsafe_code = "forbid"
