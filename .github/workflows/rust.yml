name: Rust native checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'design-system/**'
      - '.github/workflows/rust.yml'

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      KITLANE_ACCOUNT_API: ${{ vars.KITLANE_ACCOUNT_API }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev
      - name: Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.97.1 fmt --all --check
      - run: cargo +1.97.1 test --workspace --locked
      - run: cargo +1.97.1 clippy --workspace --all-targets --locked -- -D warnings
      - name: Windows installer compiler
        if: runner.os == 'Windows' && vars.KITLANE_ACCOUNT_API != ''
        shell: pwsh
        run: ./installer/setup-compiler.ps1 -Destination "$env:RUNNER_TEMP/inno"
      - name: Build Windows installer
        if: runner.os == 'Windows' && vars.KITLANE_ACCOUNT_API != ''
        shell: pwsh
        run: ./installer/build.ps1 -Compiler "$env:RUNNER_TEMP/inno/ISCC.exe"
      - name: Save Windows installer
        if: runner.os == 'Windows' && vars.KITLANE_ACCOUNT_API != ''
        uses: actions/upload-artifact@v4
        with:
          name: Kitlane-Windows-Setup
          path: dist/Kitlane-*-Setup-x64.exe
          if-no-files-found: error
